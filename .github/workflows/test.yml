name: Test

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        luaVersion:
          - 5.1
          - 5.2
          - 5.3
          - luajit
          - luajit-openresty
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup MSVC
      uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.31.1
      if: runner.os == 'Windows' && !startsWith(matrix.luaVersion, 'luajit')

    - name: Install Lua
      uses: luarocks/gh-actions-lua@56eba09993704b908cc3c7c2753e630d18cb9696 # v14
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - name: Install LuaRocks
      uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7

    - name: Install test dependencies (luacov)
      run: luarocks install luacov

    - name: Build
      run: luarocks make "markdown-scm-1.rockspec"

    - name: Test collecting coverage statistics
      run: lua -lluacov "markdown-tests.lua"

    - name: Generate coverage report
      run: luacov

    - name: Upload Coverage
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
